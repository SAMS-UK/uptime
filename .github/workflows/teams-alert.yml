name: Teams Alerts

on:
  workflow_run:
    workflows: ["Uptime CI"]
    types:
      - completed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Upptime State Transition
        id: check
        run: |
          # 1. Identify which service history file was modified during this run
          CHANGED_FILE=$(git diff-tree --no-commit-id --name-only -r ${{ github.event.workflow_run.head_sha }} | grep "history/" | head -n 1)
          
          if [ -z "$CHANGED_FILE" ]; then
            echo "No service history file changed in this workflow execution."
            echo "current_status=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract cleanly formatted service name from filename (e.g., history/hab-reports.yml -> hab-reports)
          FILENAME=$(basename "$CHANGED_FILE" .yml)
          # Convert filename slug to a cleaner presentation title (e.g., hab-reports -> Hab-reports)
          SERVICE=$(echo "$FILENAME" | sed 's/-/ /g' | awk '{for(i=1;i<=NF;i++)sub(/./,toupper(substr($i,1,1)),$i)}1')
          echo "Service identified: $SERVICE"

          # 2. Check current status logged inside the Upptime tracking data file
          if git show ${{ github.event.workflow_run.head_sha }}:$CHANGED_FILE | grep -q "status: up"; then
            current_status="up"
          elif git show ${{ github.event.workflow_run.head_sha }}:$CHANGED_FILE | grep -q "status: down"; then
            current_status="down"
          else
            current_status="none"
          fi

          # 3. Check what the status was right BEFORE this commit ran
          previous_status="unknown"
          if git show ${{ github.event.workflow_run.head_sha }}~1:$CHANGED_FILE > /dev/null 2>&1; then
            if git show ${{ github.event.workflow_run.head_sha }}~1:$CHANGED_FILE | grep -q "status: down"; then
              previous_status="down"
            elif git show ${{ github.event.workflow_run.head_sha }}~1:$CHANGED_FILE | grep -q "status: up"; then
              previous_status="up"
            fi
          fi

          echo "Current Status: $current_status"
          echo "Previous Status: $previous_status"

          echo "current_status=$current_status" >> $GITHUB_OUTPUT
          echo "previous_status=$previous_status" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT

      - name: Send DOWN alert
        if: steps.check.outputs.current_status == 'down' && steps.check.outputs.previous_status != 'down'
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "🚨 Service Down",
                      "weight": "Bolder",
                      "size": "Large",
                      "color": "Attention"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${{ steps.check.outputs.service }} is currently unreachable.",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "Repo: ${{ github.repository }}",
                      "isSubtle": true,
                      "wrap": true
                    }
                  ],
                  "actions": [{
                    "type": "Action.OpenUrl",
                    "title": "View Status Page",
                    "url": "https://github.com/${{ github.repository }}"
                  }]
                }
              }]
            }'

      - name: Send RECOVERY alert
        if: steps.check.outputs.current_status == 'up' && steps.check.outputs.previous_status == 'down'
        run: |
          curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io",
                  "type": "AdaptiveCard",
                  "version": "1.2",
                  "body": [
                    {
                      "type": "TextBlock",
                      "text": "✅ Service Recovered",
                      "weight": "Bolder",
                      "size": "Large",
                      "color": "Good"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${{ steps.check.outputs.service }} is back online.",
                      "wrap": true
                    },
                    {
                      "type": "TextBlock",
                      "text": "Repo: ${{ github.repository }}",
                      "isSubtle": true,
                      "wrap": true
                    }
                  ],
                  "actions": [{
                    "type": "Action.OpenUrl",
                    "title": "View Status Page",
                    "url": "https://github.com/${{ github.repository }}"
                  }]
                }
              }]
            }'
