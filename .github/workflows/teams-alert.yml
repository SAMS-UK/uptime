name: Teams Alerts

on:
  workflow_run:
    workflows: ["Uptime CI"]
    types:
      - completed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          # Fetch the main history tree branch to read the real updates pushed by Upptime
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 20

      - name: Process Upptime Status Changes
        id: monitor
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          # 1. Target the absolute tip commit where Upptime just pushed the data changes
          REAL_SHA=$(git log --grep="\[upptime\]" -1 --format=%H)

          if [ -z "$REAL_SHA" ]; then
            echo "No recent Upptime data commit found."
            exit 0
          fi

          echo "Analyzing latest Upptime data commit: $REAL_SHA"

          # Confirm summary.json actually changed in this commit
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$REAL_SHA" | grep "history/summary.json" || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "summary.json was not updated in this commit."
            exit 0
          fi

          # Extract current and previous status maps: slug -> status
          git show "$REAL_SHA":history/summary.json > current.json
          git show "$REAL_SHA"~1:history/summary.json > previous.json 2>/dev/null || echo "[]" > previous.json

          jq -r '.[] | "\(.slug)|\(.status)"' current.json > current_statuses.txt
          jq -r '.[] | "\(.slug)|\(.status)"' previous.json > previous_statuses.txt

          echo "--- Current statuses ---"
          cat current_statuses.txt
          echo "--- Previous statuses ---"
          cat previous_statuses.txt

          # Compare line by line for each slug
          while IFS='|' read -r SLUG CURRENT_STATUS; do
            PREVIOUS_STATUS=$(grep "^${SLUG}|" previous_statuses.txt | cut -d'|' -f2)
            [ -z "$PREVIOUS_STATUS" ] && PREVIOUS_STATUS="unknown"

            SERVICE_NAME=$(jq -r --arg s "$SLUG" '.[] | select(.slug == $s) | .name' current.json)

            echo "-> $SERVICE_NAME: $PREVIOUS_STATUS -> $CURRENT_STATUS"

            if [ "$CURRENT_STATUS" = "down" ] && [ "$PREVIOUS_STATUS" != "down" ]; then
              echo "🚨 Dispatching Down Alert for $SERVICE_NAME..."
              curl -X POST "$TEAMS_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d '{
                  "type": "message",
                  "attachments": [{
                    "contentType": "application/vnd.microsoft.card.adaptive",
                    "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.2",
                      "body": [
                        {"type": "TextBlock", "text": "🚨 Service Down", "weight": "Bolder", "size": "Large", "color": "Attention"},
                        {"type": "TextBlock", "text": "'"$SERVICE_NAME"' is currently unreachable.", "wrap": true},
                        {"type": "TextBlock", "text": "Repo: ${{ github.repository }}", "isSubtle": true, "wrap": true}
                      ],
                      "actions": [{"type": "Action.OpenUrl", "title": "View Status Page", "url": "https://github.com/${{ github.repository }}"}]
                    }
                  }]
                }'
            fi

            if [ "$CURRENT_STATUS" = "up" ] && [ "$PREVIOUS_STATUS" = "down" ]; then
              echo "✅ Dispatching Recovery Alert for $SERVICE_NAME..."
              curl -X POST "$TEAMS_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d '{
                  "type": "message",
                  "attachments": [{
                    "contentType": "application/vnd.microsoft.card.adaptive",
                    "content": {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.2",
                      "body": [
                        {"type": "TextBlock", "text": "✅ Service Recovered", "weight": "Bolder", "size": "Large", "color": "Good"},
                        {"type": "TextBlock", "text": "'"$SERVICE_NAME"' is back online.", "wrap": true},
                        {"type": "TextBlock", "text": "Repo: ${{ github.repository }}", "isSubtle": true, "wrap": true}
                      ],
                      "actions": [{"type": "Action.OpenUrl", "title": "View Status Page", "url": "https://github.com/${{ github.repository }}"}]
                    }
                  }]
                }'
            fi
          done < current_statuses.txt
